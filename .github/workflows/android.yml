name: Android

# A published GitHub release builds a signed app bundle and sends it to Google Play.
# The tag gives the version name and the tracks: 1.1.1 goes to production, alpha, beta
# and internal, 1.1.1-alpha to alpha, beta and internal, 1.1.1-beta to beta and internal,
# and any other pre-release to internal.
# A manual run builds the same signed bundle and APK and keeps them as run artifacts;
# it uploads to Google Play only when "deploy" is ticked.
# A test build has debug logging on and only ever goes to the internal track.
# The api choice picks which VITE_*_API_BASE_URL the app talks to.
# Pull requests that touch the app only check that the Android project builds.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - src-capacitor/**
      - src/boot/native.ts
      - src/utils/native-push.ts
      - quasar.config.ts
      - .github/workflows/android.yml
  workflow_dispatch:
    inputs:
      build:
        description: Which build to make
        type: choice
        options: [production, test]
        default: production
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      api:
        description: Which API the app talks to
        type: choice
        options: [production, staging, development]
        default: production
      deploy:
        description: Upload the bundle to Google Play
        type: boolean
        default: false
      update:
        description: How installed apps take this release (immediate blocks the app until updated)
        type: choice
        options: [flexible, immediate]
        default: flexible

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ubuntu runner ships the Android SDK; Gradle fetches missing platforms itself
  android:
    runs-on: ubuntu-latest

    # Commits the raised version back after a deploy
    permissions:
      contents: write

    env:
      VITE_APP_ENVIRONMENT: production
      VITE_API_ENVIRONMENT: production
      RELEASE: ${{ github.event_name != 'pull_request' }}
      DEPLOY: ${{ github.event_name == 'release' || inputs.deploy == true }}
      BUILD: ${{ inputs.build || 'production' }}
      API: ${{ inputs.api || 'production' }}
      BUMP: ${{ inputs.bump || 'patch' }}

    steps:
      # Full history, so the release notes can find the last release commit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            src-ssr/yarn.lock
            src-capacitor/yarn.lock

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn --cwd src-ssr install --frozen-lockfile
          yarn --cwd src-capacitor install --frozen-lockfile

      # Repository variables named VITE_* override the values in .env
      - name: Load VITE_* variables
        env:
          VARS: ${{ toJSON(vars) }}
        run: echo "$VARS" | jq -r 'to_entries[] | select(.key | startswith("VITE_")) | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      # Set after the VITE_* variables so the choices win over them
      - name: Apply the build and API choices
        env:
          DEV_URL: ${{ vars.VITE_DEV_API_BASE_URL }}
          STAGING_URL: ${{ vars.VITE_STAGING_API_BASE_URL }}
        run: |
          echo "VITE_API_ENVIRONMENT=$API" >> "$GITHUB_ENV"
          if [ "$BUILD" = test ]; then
            echo "VITE_APP_ENVIRONMENT=staging" >> "$GITHUB_ENV"
            echo "VITE_DEBUG=true" >> "$GITHUB_ENV"
          fi
          if [ "$API" = staging ] && [ -z "$STAGING_URL" ]; then
            echo "::warning::VITE_STAGING_API_BASE_URL is not set, so the app talks to VITE_API_BASE_URL."
          fi
          if [ "$API" = development ] && [ -z "$DEV_URL" ]; then
            echo "::warning::VITE_DEV_API_BASE_URL is not set, so the app uses the address in .env, which a phone can't reach."
          fi

      # Sets package.json's version (from the release tag, or raised by the bump
      # choice) and build number, and picks the Play tracks. The build number is the
      # Play version code, so it never goes below the run-based code used before.
      - name: Set version
        if: env.RELEASE == 'true'
        env:
          OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET || '0' }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          DEFAULT_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            NAME="${TAG#v}"
            if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Release tag $TAG is not a version like 1.1.1, 1.1.1-alpha or 1.1.1-beta."
              exit 1
            fi
            case "$NAME" in
              *-alpha*) TRACK=alpha ;;
              *-beta*) TRACK=beta ;;
              *-*) TRACK=internal ;;
              *) [ "$PRERELEASE" = true ] && TRACK=internal || TRACK=production ;;
            esac
            case "$TRACK" in
              production) TRACKS=production,alpha,beta,internal ;;
              alpha) TRACKS=alpha,beta,internal ;;
              beta) TRACKS=beta,internal ;;
              *) TRACKS="$TRACK" ;;
            esac
            npm version "$NAME" --no-git-tag-version --allow-same-version > /dev/null
          else
            npm version "$BUMP" --no-git-tag-version > /dev/null
            NAME=$(jq -r .version package.json)
            TRACK="$DEFAULT_TRACK"
            TRACKS="$DEFAULT_TRACK"
            if [ "$BUILD" = test ]; then
              NAME="$NAME-test"
              TRACK=internal
              TRACKS=internal
            fi
          fi
          LAST=$(jq -r '.build // 0' package.json)
          RUN=$(( ${{ github.run_number }} + OFFSET ))
          CODE=$(( LAST + 1 > RUN ? LAST + 1 : RUN ))
          jq --argjson code "$CODE" '.build = $code' package.json > package.json.tmp
          mv package.json.tmp package.json
          {
            echo "ANDROID_VERSION_CODE=$CODE"
            echo "ANDROID_VERSION_NAME=$NAME"
            echo "ANDROID_PACKAGE_VERSION=$(jq -r .version package.json)"
            echo "ANDROID_TRACK=$TRACK"
            echo "ANDROID_TRACKS=$TRACKS"
          } >> "$GITHUB_ENV"
          echo "Version $NAME, build $CODE, tracks $TRACKS"

      # Builds the UI into src-capacitor/www and syncs it into the Android project
      - name: Build the app
        run: yarn build:android

      - name: Add Firebase config
        if: env.RELEASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Set the GOOGLE_SERVICES_JSON secret, or push notifications won't reach the app."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > src-capacitor/android/app/google-services.json

      - name: Add signing key
        if: env.RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 secret to sign the app."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Check the Android build
        if: env.RELEASE != 'true'
        working-directory: src-capacitor/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build the signed bundle
        if: env.RELEASE == 'true'
        working-directory: src-capacitor/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      # The bundle is what Google Play takes; the APK installs directly on a phone
      - name: Keep the bundle and APK
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: toneflix-music-${{ env.BUILD }}-${{ env.ANDROID_VERSION_CODE }}
          path: |
            src-capacitor/android/app/build/outputs/bundle/release/app-release.aab
            src-capacitor/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Play's "What's new" text from the PRs and direct commits since the last
      # release. A production release skips past pre-releases and test builds.
      - name: Write release notes
        if: env.DEPLOY == 'true'
        run: |
          node .github/scripts/release-notes.mjs "$RUNNER_TEMP/whatsnew" \
            ${{ env.ANDROID_TRACK == 'production' && '--skip-prereleases' || '' }}
          {
            echo '### Release notes'
            echo '```'
            cat "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Google Play
        if: env.DEPLOY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.toneflix.music.app
          releaseFiles: src-capacitor/android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ env.ANDROID_TRACKS }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          # Priority 4 and up makes the app's in-app update immediate (src/utils/app-updates.ts)
          inAppUpdatePriority: ${{ inputs.update == 'immediate' && 5 || 2 }}

      # Keeps the version and build number once Google Play has the bundle. A release
      # commits to the branch it was cut from, or the default branch for a commit.
      - name: Commit the new version
        if: env.DEPLOY == 'true'
        env:
          TARGET: ${{ github.event.release.target_commitish || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="$TARGET"
          if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            BRANCH="$DEFAULT_BRANCH"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout -f -B "$BRANCH" FETCH_HEAD
          jq --arg version "$ANDROID_PACKAGE_VERSION" --argjson code "$ANDROID_VERSION_CODE" \
            '.version = $version | .build = $code' package.json > package.json.tmp
          mv package.json.tmp package.json
          git add package.json
          git commit -m "chore: Android release $ANDROID_VERSION_NAME (build $ANDROID_VERSION_CODE) [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
