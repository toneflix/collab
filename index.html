<!doctype html>
<html style="overflow-x: hidden">
  <head>
    <title><%= productName %></title>
    <!-- <% if (!ctx.mode.ssr) { %> -->
    <!-- <% } %> -->

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#0a0c10" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-icon-180x180.png"
    />
    <% if (!ctx.mode.ssr) { %>
    <!--
      The launch splash, drawn like the Android one (gold glow, logo, MUSIC), until
      the first page is ready. Plain HTML and CSS, so it shows before any script runs.
    -->
    <style>
      #app-splash {
        --mark: min(18vw, 11vh);

        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #c28e00;
        background-image: radial-gradient(
          circle farthest-corner at 50% 50%,
          #f7c400 0%,
          #eab700 20%,
          #e4b100 30%,
          #dba800 45%,
          #d29f00 60%,
          #c99500 75%,
          #c28e00 90%
        );
        transition: opacity 0.35s ease;
      }

      #app-splash.app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }

      .app-splash__brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--mark) * 0.27);
      }

      .app-splash__brand svg {
        display: block;
        width: var(--mark);
        height: auto;
        aspect-ratio: 458.2 / 829.2;
        overflow: visible;
      }

      .app-splash__brand span {
        /* Letter spacing adds space after the last letter, so pad the start to keep it centred */
        padding-left: 0.42em;
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: calc(var(--mark) * 0.3);
        font-weight: 600;
        letter-spacing: 0.42em;
        line-height: 1;
      }
    </style>
    <% } %>
  </head>
  <body>
    <% if (!ctx.mode.ssr) { %>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__brand">
        <svg
          viewBox="185.5 0 458.2 829.2"
          width="240"
          height="434"
          aria-hidden="true"
          focusable="false"
        >
          <defs>
            <linearGradient
              id="splash-stem"
              gradientUnits="userSpaceOnUse"
              gradientTransform="matrix(1.9751611,0,0,1.9751611,1302.841,-1633.0164)"
              x1="217.55739"
              y1="707.90869"
              x2="344.77231"
              y2="223.60364"
            >
              <stop offset="0" stop-color="#00afff" />
              <stop offset="1" stop-color="#00eaff" />
            </linearGradient>
            <linearGradient
              id="splash-dot"
              gradientUnits="userSpaceOnUse"
              gradientTransform="matrix(0.95911952,0,0,0.95911952,1517.3123,-1110.4207)"
              x1="554.9422"
              y1="521.16412"
              x2="760.87701"
              y2="521.16412"
            >
              <stop offset="0" stop-color="#00afff" />
              <stop offset="1" stop-color="#00eaff" />
            </linearGradient>
            <linearGradient
              id="splash-bar"
              gradientUnits="userSpaceOnUse"
              gradientTransform="matrix(1.9751611,0,0,1.9751611,1302.841,-1633.0164)"
              x1="211.87108"
              y1="234.19159"
              x2="476.87933"
              y2="361.97623"
            >
              <stop offset="0" stop-color="#00afff" />
              <stop offset="1" stop-color="#00eaff" />
            </linearGradient>
            <filter
              id="splash-shadow"
              x="-0.094860497"
              y="-0.10034988"
              width="1.227721"
              height="1.196065"
              style="color-interpolation-filters: sRGB"
            >
              <feFlood flood-opacity="0.498039" flood-color="rgb(0,0,0)" result="flood" />
              <feComposite in="flood" in2="SourceGraphic" operator="in" result="composite1" />
              <feGaussianBlur in="composite1" stdDeviation="9.46524" result="blur" />
              <feOffset dx="9.1" dy="-1.1" result="offset" />
              <feComposite in="SourceGraphic" in2="offset" operator="over" result="composite2" />
            </filter>
          </defs>
          <g transform="matrix(0.86681712,0,0,0.86681712,-1305.1468,1032.6983)">
            <path
              d="m 1983.8219,-1191.3631 c -239.7332,85.8245 -251.27,350.52635 -251.27,587.00253 v 369.57805 c 278.7148,-122.08094 247.9851,-536.06417 250.2248,-652.7054 z"
              opacity="0.99"
              fill="url(#splash-stem)"
            />
            <rect
              x="163.9809"
              y="-784.70337"
              width="239.4735"
              height="237.33536"
              opacity="0.99"
              fill="#00afff"
              filter="url(#splash-shadow)"
              transform="matrix(0,0.32486076,-0.91760191,0,1259.9185,-1056.7798)"
            />
            <circle cx="2148.3262" cy="-610.56146" r="98.758072" fill="url(#splash-dot)" />
            <path
              d="m 1719.7682,-925.80093 h 528.4059 l -0.078,-248.83007 c -419.476,-0.022 -479.3501,110.8707 -528.328,248.83007 z"
              opacity="0.99"
              fill="url(#splash-bar)"
            />
          </g>
        </svg>
        <span>MUSIC</span>
      </div>
    </div>
    <script>
      // Never leave it up if the app can't start
      setTimeout(function () {
        var splash = document.getElementById('app-splash');
        if (splash) splash.remove();
      }, 20000);
    </script>
    <% } %>
    <!-- quasar:entry-point -->
  </body>
</html>
